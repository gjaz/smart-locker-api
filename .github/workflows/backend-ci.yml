name: SmartLocker Backend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore SmartLocker.Api.slnx

      - name: Build
        run: dotnet build SmartLocker.Api.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test SmartLocker.Api.slnx --no-build --configuration Release

      - name: Build Docker image
        run: docker build -t smartlocker-api:${{ github.sha }} .