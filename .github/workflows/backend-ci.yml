name: SmartLocker Backend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore SmartLocker.Api.slnx

      - name: Build
        run: dotnet build SmartLocker.Api.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test SmartLocker.Api.slnx --no-build --configuration Release

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/gjaz/smart-locker-api:${{ github.sha }} \
            -t ghcr.io/gjaz/smart-locker-api:latest \
            .

      - name: Push Docker image
        run: |
          docker push ghcr.io/gjaz/smart-locker-api:${{ github.sha }}
          docker push ghcr.io/gjaz/smart-locker-api:latest